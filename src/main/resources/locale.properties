man.example=Example:
man.note=Note:

man.drop.cmd=DROP item
man.drop.arg=item - item to be dropped from the inventory to the current room.
man.drop.example=DROP Rusty key

man.exit.cmd=EXIT
man.exit.desc=Quits the game without saving.

man.go.cmd=GO room | alias
man.go.arg.room=room - specific room you want to traverse to that is connected to the current room.
man.go.arg.alias=alias - initialism of the specific room.
man.go.example.room=GO Central Atrium
man.go.example.alias=GO MH

man.help.cmd=HELP [command]
man.help.arg=command - command name to display information on.

man.hint.cmd=HINT
man.hint.desc=Offers a hint based on the player's location for when they're stuck.

man.interact.cmd=INTERACT character
man.interact.arg=character - character in the current room to initiate a conversation with.
man.interact.example=INTERACT The Angler

man.investigate.cmd=INVESTIGATE
man.investigate.desc=Prints the full description of the room, including visible items and characters.

man.pickup.cmd=PICKUP item
man.pickup.arg=item - item to be picked up from the current room.
man.pickup.example=PICKUP Rusty Key
man.pickup.note=The inventory has a capacity of %d items.

man.use.cmd=USE item
man.use.arg=item - item from your inventory to be used.
man.use.example=USE Rusty Key

game.intro=They called it the neon jewel of the underground... until the flood of '87 buried it alive. For decades, \
the Azure Galleria has been nothing but a rumor, a ghost story. You wanted to be the first to find it.\n\nYou lower \
yourself down the ventilation shaft, your surroundings getting darked by the second. When suddenly, your rope snaps, \
and you plummet into the dark water below.\n\nYou surface in the Central Atrium. The slowly rising water is freezing. \
Your rope is gone. The shaft is too high. The only sound is the dripping of water and the hum of dying electricity.\n\n\
OBJECTIVE: Get out of here as soon as possible.
room.generatorRoom=Generator Room
win.message=You slam your hand against the elevator call button. For a terrifying second nothing happens. \
Then, a mechanical groan vibrates through the floor. The gears shriek, scraping off decades of rust, and the heavy \
cage begins to rise. You watch through the grate as the flooded ruins of the Azure Galleria shrink below you.\n\nWith \
a final jolt, the doors slide open. Blinding sunlight in your eyes. You take a deep breath of clean air.\n\nYou have \
escaped the drowned mall.