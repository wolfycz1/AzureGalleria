game.intro=Říkali mu neonový klenot podzemního světa... dokud ho v roce '87 nezahltila povodeň. Po celá desetiletí \
byla Azure Galleria jen pověstí, strašidelnou historkou. Chtěl jsi být první, kdo ji najde.\n\nSpustíš se do \
ventilační šachty a tvoje okolí se každou vteřinou začíná stmívat. Najednou se lano přetrhne a zřítíte se do temné \
vody pod tebout.\n\nVynoříš se v Centrálním Atriu. Pomalu stoupající voda je ledová. Lano je pryč a šachta je příliš \
vysoko. Jediným zdrojem zvuku je kapání vody a bzučení umírající elektřiny.\n\nCÍL: Co nejrychleji se odtud dostat.
room.generatorRoom=Strojovna
win.message=Praštíš rukou do tlačítka od výtahu. Po děsivou vteřinu se nic neděje. Pak se podlahou rozlehne mechanické \
skřípání. Ozubená kola zaskřípou, odstraňujíc desítky let starou rez, a těžká klec se začne zvedat. Skrz mříž \
sleduješ, jak se pod tebou zmenšují zaplavené ruiny Azure Galleria.\n\nPo jednom posledním trhnutí se dveře otevřou. \
Do očí tě zasáhne oslňující záře slunce. Zhluboka se nadechneš čistého vzduchu.\n\nÚspěšně jsi utekl z topícího se \
nákupního centra.