game.intro=Nazywano ją neonowym klejnotem podziemia... aż do momentu, gdy powódź z '87 roku pogrąża ją w ciemnościach. \
Przez dziesięciolecia Azure Galleria była jedynie plotką, legendą. Chciałeś być pierwszym, który ją odnajdzie.\n\n\
Spuściłeś się w dół szybu wentylacyjnego, a otoczenie z każdą sekundą stawało się coraz ciemniejsze. Nagle lina pękła \
i spadłeś w ciemną wodę.\n\nWypłynąłeś na powierzchnię w Centralnym Atrium. Powoli podnosząca się woda jest lodowata. \
Lina zniknęła. Szyb jest zbyt wysoko. Jedynym dźwiękiem jest kapanie wody i szum gasnącej elektryczności.\n\nCEL: Jak \
najszybciej się stąd wydostać.
room.generatorRoom=Maszynownia
win.message=Uderzasz dłonią w przycisk windy. Przez przerażającą sekundę nic się nie dzieje. Potem mechaniczny \
skrzypienie wibruje po podłodze. Koła zębate piszczą, zeskrobując dziesiątki lat rdzy, a ciężka klatka zaczyna się \
podnosić. Przez kratę obserwujesz, jak zalane ruiny Azure Galleria kurczą się pod tobą.\n\nPo ostatnim szarpnięciu \
drzwi się otwierają. Oślepiające słońce razi cię w oczy. Bierzesz głęboki wdech czystego powietrza.\n\nZdołałeś uciec \
z zatopionego sklepu.